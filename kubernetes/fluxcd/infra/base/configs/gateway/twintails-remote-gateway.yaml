apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-remote-gateway
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: traefik
  listeners:
    - name: twintails-remote-https
      protocol: HTTPS
      hostname: "*.${base_hostname}"
      port: 4443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: twintailsare-moe-tls
            kind: Secret
