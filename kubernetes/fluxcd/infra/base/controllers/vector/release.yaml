---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector-operator
  namespace: vector
spec:
  interval: 10m
  chart:
    spec:
      chart: vector-operator
      version: "v0.3.1"
      sourceRef:
        kind: HelmRepository
        name: vector-operator
        namespace: vector
  values:
    resources:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: "50m"
        memory: 64Mi