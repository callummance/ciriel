---
# Cert-manager controller
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-controller
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/controllers/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system

---
# Cert-manager configs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/configs/cert-issuer
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system
