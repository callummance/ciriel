---
# Cert-manager controller
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-controller
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/fluxcd/infra/base/controllers/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system

---
# Cert-manager configs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/fluxcd/infra/base/configs/cert-issuer
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
