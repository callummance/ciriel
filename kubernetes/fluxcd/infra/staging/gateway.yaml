---
# Gateway API CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/api-support/gateway
  sourceRef:
    kind: GitRepository
    name: flux-system

---
# Traefik controller
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-controller
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/controllers/traefik
  dependsOn:
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system

---
# Traefik configs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-configs
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/configs/gateway
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  dependsOn:
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system