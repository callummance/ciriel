---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: persistence-lpp-controller
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/fluxcd/infra/base/controllers/local-path-provisioner
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system