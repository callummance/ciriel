---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: persistence-lpp-configs
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/fluxcd/infra/base/configs/local-persistence
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: persistence-lpp-controller
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/fluxcd/infra/base/controllers/local-path-provisioner
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system