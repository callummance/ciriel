---
# Monitoring controllers
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/fluxcd/infra/base/controllers/monitoring
  prune: true
  wait: true
  dependsOn:
    - name: alertmanager-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system

---
# Alertmanager configs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alertmanager-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/fluxcd/infra/base/configs/alerts
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system