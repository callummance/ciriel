---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-operator
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/controllers/vector
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-configs
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/configs/vector-agent
  sourceRef:
    kind: GitRepository
    name: flux-system