apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/infra/base/controllers/external-dns
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
        optional: false
  sourceRef:
    kind: GitRepository
    name: flux-system