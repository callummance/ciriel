---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: api-support
  namespace: flux-system
spec:
  interval: 24h
  path: ./kubernetes/fluxcd/infra/api-support
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/fluxcd/infra/controllers
  prune: true
  wait: true
  dependsOn: 
    - name: api-support
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./kubernetes/fluxcd/infra/configs/staging
  prune: true
  wait: true
  dependsOn: 
    - name: api-support
  decryption:
    provider: sops
    secretRef: 
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system