---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-staging
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/apps/staging
  sourceRef:
    kind: GitRepository
    name: flux-system