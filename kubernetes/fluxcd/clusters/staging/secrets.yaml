---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-secrets
  namespace: flux-system
spec:
  interval: 60m
  timeout: 3m
  retryInterval: 2m
  prune: true
  wait: true
  path: ./kubernetes/fluxcd/secrets/staging
  decryption:
    provider: sops
    secretRef: 
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system