---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sops-secrets
  namespace: flux-system
spec:
  interval: 10m 
  retryInterval: 1m
  path: ./kubernetes/fluxcd/secrets/staging
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef: 
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system