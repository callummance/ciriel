---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 30m
  chart:
    spec:
      chart: pihole
      version: "^2.34.0"
      sourceRef:
        kind: HelmRepository
        name: pihole-repo
        namespace: pihole
  valuesFrom:
    - kind: "ConfigMap"
      name: pihole-config